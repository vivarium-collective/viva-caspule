[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viva-caspule"
version = "0.1.0"
description = "Process-bigraph wrapper for CASPULE (a LAMMPS variant with dynamic bond formation/breaking)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "process-bigraph>=0.0.10",
    "bigraph-schema",
    "viva-superpowers",
    "lammps",
    "numpy",
    "networkx",
    "bigraph-viz>=2.0.3",
    "pyyaml>=6.0",
    "jsonschema[format-nongpl]>=4.21",
    "jinja2>=3.1",
    "pypdf>=4.0",
    "matplotlib",
    "plotly",
    "vivarium-workbench",
]

[project.optional-dependencies]
cli = ["typer", "rich"]
dev = ["pytest", "matplotlib", "bigraph-viz"]

[tool.uv.sources]
viva-superpowers = { git = "https://github.com/vivarium-collective/pbg-superpowers.git", branch = "main" }

[tool.setuptools.packages.find]
include = ["pbg_caspule*"]

[project.scripts]
viva-caspule = "pbg_caspule.cli.__main__:main"
